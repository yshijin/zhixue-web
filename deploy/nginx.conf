# 智学测评 Nginx 示例配置
#
# 方案 A（推荐）：Nginx 托管静态文件，Spring Boot 只处理 /api。
# 请将 root 改为项目所在目录，Windows 示例为 D:/xiangmuuuu。
# Linux 示例为 /opt/zhixue。
#
# 如果希望全部交给 Spring Boot 托管，可只保留
# location / { proxy_pass http://127.0.0.1:8080; } 一段。

upstream zhixue_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root D:/xiangmuuuu;
    index index.html;
    charset utf-8;

    client_max_body_size 10m;

    # Spring Boot API，包含 Session Cookie、AI 调用和导入接口
    location /api/ {
        proxy_pass http://zhixue_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # 首页、登录页与 SPA 壳层
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /app.html {
        try_files /app.html =404;
        add_header Cache-Control "no-cache";
    }

    # hash 路由不会落到这里；保留兜底便于直接打开深层链接
    location / {
        try_files $uri $uri/ /index.html;
    }
}
